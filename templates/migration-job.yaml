{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.appName }}-migrate-{{ .Values.image.tag | trunc 12 | lower }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: {{ default 2 .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ default 600 .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}-migrate
    spec:
      restartPolicy: Never
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ default .Values.appName .Values.serviceAccount.name }}
      {{- else if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
      - name: migrate
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          {{- toYaml .Values.migration.command | nindent 10 }}
        {{- if or .Values.existingSecret .Values.existingConfigMap }}
        envFrom:
        {{- if .Values.existingSecret }}
        - secretRef:
            name: {{ .Values.existingSecret }}
        {{- end }}
        {{- if .Values.existingConfigMap }}
        - configMapRef:
            name: {{ .Values.existingConfigMap }}
        {{- end }}
        {{- end }}
        env:
        {{- range $key, $value := .Values.container.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.migration.resources | nindent 10 }}
{{- end }}
